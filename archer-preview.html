<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Archer preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a2420; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 12px; bottom: 12px; color: #e8dcc0;
      font: 13px/1.4 system-ui, sans-serif; opacity: 0.9;
      pointer-events: none; text-shadow: 0 1px 2px #0008;
    }
  </style>
</head>
<body>
  <div id="hud">拖曳旋轉 · 滾輪縮放 · 1正面 2侧面 3背面</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createArcherCharacter } from './archer-character.js?v=robe8';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc8b898);
    scene.fog = new THREE.Fog(0xc8b898, 8, 22);

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
    camera.position.set(0, 1.1, 3.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xf0e0c8, 0x5a4030, 0.8));
    const sun = new THREE.DirectionalLight(0xffe0b0, 1.25);
    sun.position.set(3, 6, 4);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xb09070, 0.32));

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(4, 48),
      new THREE.MeshStandardMaterial({ color: 0x6a6048, roughness: 0.92 }),
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function matPlay(color, opts = {}) {
      return new THREE.MeshStandardMaterial({
        color, flatShading: false, roughness: 0.78, metalness: 0.02, ...opts,
      });
    }

    const parts = createArcherCharacter(THREE, matPlay);
    parts.root.visible = true;
    scene.add(parts.root);
    window.__archer = parts;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.85, 0);
    controls.enableDamping = true;
    controls.minDistance = 1.2;
    controls.maxDistance = 8;
    controls.update();

    const views = {
      1: { pos: [0, 1.1, 3.4], target: [0, 0.85, 0] },
      2: { pos: [3.4, 1.1, 0], target: [0, 0.85, 0] },
      3: { pos: [0, 1.15, -3.4], target: [0, 0.85, 0] },
    };
    function setView(k) {
      const v = views[k];
      if (!v) return;
      camera.position.set(...v.pos);
      controls.target.set(...v.target);
      controls.update();
    }
    window.setArcherView = setView;
    window.__cam = camera;
    window.__controls = controls;

    addEventListener('keydown', (e) => {
      if (e.key === '1' || e.key === '2' || e.key === '3') setView(e.key);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
